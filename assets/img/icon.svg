<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Four corner ticks and a threshold line. Both shapes are the reference's
       own .corners and .rule vocabulary, at its 9 to 1 arm ratio scaled to 32.
       Colour is the --accent token from assets/css/tokens.css. -->
  <g fill="#d4842b">
    <rect x="2" y="2" width="9" height="2"/>
    <rect x="2" y="2" width="2" height="9"/>
    <rect x="21" y="2" width="9" height="2"/>
    <rect x="28" y="2" width="2" height="9"/>
    <rect x="2" y="28" width="9" height="2"/>
    <rect x="2" y="21" width="2" height="9"/>
    <rect x="21" y="28" width="9" height="2"/>
    <rect x="28" y="21" width="2" height="9"/>
    <rect x="7" y="15" width="18" height="2"/>
  </g>
</svg>
